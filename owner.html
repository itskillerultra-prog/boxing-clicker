<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Panel</title>
<style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:20px}.panel{max-width:760px;margin:auto;background:#111;border:1px solid #333;border-radius:18px;padding:22px}.status{padding:12px;border-radius:10px;background:#191919;margin:12px 0 18px;color:#bbb}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#191919;border:1px solid #292929;border-radius:12px;padding:12px}.label{font-size:11px;color:#888;text-transform:uppercase;font-weight:bold}.value{font-size:20px;font-weight:bold;margin-top:4px}input{width:100%;box-sizing:border-box;padding:12px;background:#090909;border:1px solid #444;color:#fff;border-radius:9px;font-size:16px}button{padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#333}button.danger{background:#991b1b}button.warn{background:#92400e}.suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.suggestions button{padding:7px 10px;font-size:12px;background:#222;border:1px solid #444}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.back{display:block;text-align:center;color:#888;margin-top:20px;text-decoration:none}@media(max-width:600px){.row,.row3,.grid{grid-template-columns:1fr}}</style></head>
<body><div class="panel"><h1>OWNER PANEL</h1><div style="color:#aaa">itskillerultrayt · FOUNDER / OWNER</div><div id="status" class="status">Checking owner permission...</div>
<div id="panel" class="hidden">
<div class="row"><div><div class="label">Player Username</div><input id="target" autocomplete="off" placeholder="Type player username"><div id="suggestions" class="suggestions"></div></div><button id="load">LOAD PLAYER</button></div>
<div class="row3"><div class="card"><div class="label">Cash</div><div id="cash" class="value">0</div></div><div class="card"><div class="label">Punches</div><div id="punches" class="value">0</div></div><div class="card"><div class="label">Rebirths</div><div id="rebirths" class="value">0</div></div></div>
<div class="row3"><input id="cashIn" type="number" min="0" placeholder="Cash"><input id="punchIn" type="number" min="0" placeholder="Punches"><input id="rebirthIn" type="number" min="0" placeholder="Rebirths"></div>
<div class="grid"><button id="set">SET STATS</button><button id="add" class="secondary">ADD TO STATS</button><button id="ban" class="danger">BAN PLAYER</button><button id="unban" class="secondary">UNBAN PLAYER</button><button id="ipban" class="warn">IP BAN</button><button id="ipunban" class="secondary">REMOVE IP BAN</button><button id="reset" class="danger">RESET PROGRESS</button><button id="del" class="danger">DELETE ACCOUNT</button></div>
</div><a class="back" href="/">← Back to Game</a></div>
<script>
const PROFILE_KEY='boxing_clicker_profile_v2', OWNER='itskillerultrayt'; const $=id=>document.getElementById(id); let profile=null, loaded='';
function setStatus(t){$('status').textContent=t}
function getProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')}catch(e){return null}}
async function request(action,extra={}){const r=await fetch('/api/owner',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action,username:profile.username,authToken:profile.authToken,...extra})});let d={};try{d=await r.json()}catch(e){d={success:false,error:'Invalid server response.'}};return {r,d}}
async function verifyOwner(){profile=getProfile();if(!profile?.username||!profile?.authToken){setStatus('OWNER LOGIN REQUIRED — log in as itskillerultrayt in the main game first.');return false}if(profile.username!==OWNER){setStatus('OWNER ACCESS DENIED.');return false}setStatus('Checking owner permission...');try{const {r,d}=await request('get_stats');if(r.ok&&d.success){$('panel').classList.remove('hidden');setStatus('Owner access verified.');return true}setStatus(d.error||'Owner permission check failed.');return false}catch(e){setStatus('Could not connect to owner server.');return false}}
function display(d){loaded=d.username;$('cash').textContent=Number(d.cash||0).toLocaleString();$('punches').textContent=Number(d.punches||0).toLocaleString();$('rebirths').textContent=Number(d.rebirths||0).toLocaleString();$('cashIn').value=d.cash||0;$('punchIn').value=d.punches||0;$('rebirthIn').value=d.rebirths||0}
async function loadPlayer(){const name=$('target').value.trim();if(!name){setStatus('Enter a player username.');return}const {r,d}=await request('get_player',{targetUsername:name});if(r.ok&&d.success){display(d);setStatus(`Loaded ${d.username}.`)}else setStatus(d.error||'Player not found.')}
async function suggestions(){const q=$('target').value.trim();const box=$('suggestions');box.innerHTML='';if(!q)return;try{const r=await fetch('/api/player-suggestions',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({username:profile.username,authToken:profile.authToken,search:q})});const d=await r.json();if(!d.success)return;(d.players||[]).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.type='button';b.onclick=()=>{$('target').value=n;box.innerHTML='';loadPlayer()};box.appendChild(b)})}catch(e){}}
async function action(name){if(!loaded){setStatus('Load a player first.');return}let extra={targetUsername:loaded};if(name==='set_stats'){extra.cash=Number($('cashIn').value)||0;extra.punches=Number($('punchIn').value)||0;extra.rebirths=Number($('rebirthIn').value)||0}if(name==='add_stats'){extra.cash=Number($('cashIn').value)||0;extra.punches=Number($('punchIn').value)||0;extra.rebirths=Number($('rebirthIn').value)||0}if(!confirm(name.replaceAll('_',' ').toUpperCase()+' for '+loaded+'?'))return;const {r,d}=await request(name,extra);if(r.ok&&d.success){setStatus(d.message||'Done.');await loadPlayer()}else setStatus(d.error||'Action failed.')}
$('load').onclick=loadPlayer;$('target').addEventListener('input',suggestions);$('target').addEventListener('keydown',e=>{if(e.key==='Enter')loadPlayer()});$('set').onclick=()=>action('set_stats');$('add').onclick=()=>action('add_stats');$('ban').onclick=()=>action('ban_player');$('unban').onclick=()=>action('unban_player');$('ipban').onclick=()=>action('ban_ip');$('ipunban').onclick=()=>action('unban_ip');$('reset').onclick=()=>action('reset_progress');$('del').onclick=()=>action('delete_player');verifyOwner();
</script></body></html>
