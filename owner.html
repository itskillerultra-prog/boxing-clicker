<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #080c14;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body class="min-h-screen p-5">

    <div class="max-w-xl mx-auto">

        <div class="mb-6">
            <h1 class="text-3xl font-bold text-yellow-400">
                OWNER PANEL
            </h1>

            <p class="text-slate-400 mt-1">
                Boxing Punching Bag Clicker
            </p>
        </div>

        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5">

            <h2 class="text-xl font-bold mb-4">
                Owner
            </h2>

            <div class="bg-black/30 border border-slate-800 rounded-xl p-4 mb-5">
                <p class="text-sm text-slate-400">Username</p>
                <p class="text-lg font-bold text-white">
                    itskillerultrayt
                </p>

                <p class="text-xs text-black bg-white inline-block px-2 py-1 rounded mt-2 font-bold">
                    FOUNDER / OWNER
                </p>
            </div>

            <div class="space-y-4">

                <div>
                    <label class="block text-sm text-slate-400 mb-1">
                        Cash
                    </label>

                    <input
                        id="cash"
                        type="number"
                        value="0"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white"
                    >
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">
                        Punches
                    </label>

                    <input
                        id="punches"
                        type="number"
                        value="0"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white"
                    >
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">
                        Rebirths
                    </label>

                    <input
                        id="rebirths"
                        type="number"
                        value="0"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white"
                    >
                </div>

                <button
                    id="save-btn"
                    class="w-full bg-blue-600 hover:bg-blue-500 rounded-xl py-3 font-bold"
                >
                    SAVE OWNER STATS
                </button>

                <p id="status" class="text-center text-sm text-slate-400"></p>

            </div>

        </div>

    </div>

</body>
</html>
