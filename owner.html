<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boxing Clicker — Owner Panel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#fff;font-family:Arial,sans-serif}body{padding:18px;display:flex;justify-content:center;align-items:flex-start}.panel{width:min(760px,100%);margin:10px auto;background:#111;border:1px solid #303030;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0008}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:28px;font-weight:900}.sub{color:#999;margin-top:5px}.tag{display:inline-block;margin-top:12px;padding:5px 9px;border:1px solid #444;border-radius:7px;font-size:11px;font-weight:800}.status{margin:18px 0;padding:12px 14px;border-radius:10px;background:#181818;border:1px solid #292929;color:#bbb;word-break:break-word}.content{display:none}.section{margin-top:18px;padding:16px;border:1px solid #292929;border-radius:13px;background:#0d0d0d}.section h2{font-size:16px;margin:0 0 12px}.label{display:block;color:#aaa;font-size:12px;font-weight:800;margin-bottom:6px}.targetRow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px}.input{width:100%;height:46px;padding:0 13px;background:#070707;border:1px solid #444;border-radius:9px;color:#fff;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}.input:focus{border-color:#fff;box-shadow:0 0 0 2px #fff2}.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.btn{min-height:44px;border:1px solid #444;border-radius:9px;background:#202020;color:#fff;font-weight:800;cursor:pointer;padding:10px 12px}.btn:hover{background:#2b2b2b}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.danger{border-color:#743737;background:#321919}.btn.good{border-color:#365c3b;background:#182719}.btn:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{background:#171717;border-radius:10px;padding:13px;text-align:center}.stat b{display:block;color:#999;font-size:11px}.stat strong{display:block;font-size:21px;margin-top:5px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:18px}.back:hover{color:#fff}.hidden{display:none!important}@media(max-width:650px){body{padding:10px}.panel{padding:15px;border-radius:14px}.targetRow{grid-template-columns:1fr}.btns{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.fields{grid-template-columns:1fr 1fr}.title{font-size:23px}}@media(max-width:380px){.stats{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="panel">
<div class="top"><div><div class="title">OWNER PANEL</div><div class="sub">itskillerultrayt</div><div class="tag">FOUNDER / OWNER</div></div></div>
<div id="status" class="status">Checking owner access...</div>
<div id="content" class="content">
<section class="section">
<h2>Player</h2>
<label class="label" for="target">PLAYER USERNAME</label>
<div class="targetRow"><input id="target" class="input" type="text" placeholder="Enter player username" autocomplete="off" spellcheck="false"><button id="load" class="btn primary" type="button">LOAD PLAYER</button></div>
<div class="stats"><div class="stat"><b>CASH</b><strong id="cashDisplay">0</strong></div><div class="stat"><b>PUNCHES</b><strong id="punchesDisplay">0</strong></div><div class="stat"><b>REBIRTHS</b><strong id="rebirthsDisplay">0</strong></div></div>
</section>
<section class="section"><h2>Edit stats</h2><div class="fields"><div><label class="label">Cash</label><input id="cash" class="input" type="number" min="0" value="0"></div><div><label class="label">Punches</label><input id="punches" class="input" type="number" min="0" value="0"></div><div><label class="label">Rebirths</label><input id="rebirths" class="input" type="number" min="0" value="0"></div><div><label class="label">Rebirth Tokens</label><input id="tokens" class="input" type="number" min="0" value="0"></div></div><div class="btns"><button id="set" class="btn primary" type="button">SET STATS</button><button id="add" class="btn" type="button">ADD TO STATS</button></div></section>
<section class="section"><h2>Player controls</h2><div class="btns"><button id="ban" class="btn danger" type="button">BAN PLAYER</button><button id="unban" class="btn good" type="button">UNBAN PLAYER</button><button id="ipban" class="btn danger" type="button">IP BAN</button><button id="ipunban" class="btn good" type="button">REMOVE IP BAN</button><button id="reset" class="btn" type="button">RESET PROGRESS</button><button id="delete" class="btn danger" type="button">DELETE ACCOUNT</button></div></section>
</div>
<a class="back" href="/">← Back to Game</a>
</main>
<script>
const PROFILE_KEY='boxing_clicker_profile_v2',OWNER='itskillerultrayt',API='/api/owner';
const $=id=>document.getElementById(id);let profile=null,loaded=false;
function profileLoad(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')}catch(e){return null}}
function status(t){$('status').textContent=t}
function fmt(n){return Number(n||0).toLocaleString()}
function target(){return $('target').value.trim()}
async function req(action,extra={}){if(!profile?.username||!profile?.authToken)throw new Error('Owner login session is missing. Open the main game, log in as the owner, then open this panel again.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,username:profile.username,authToken:profile.authToken,...extra})});let d={};try{d=await r.json()}catch(e){throw new Error('Owner API returned an invalid response.')}if(!r.ok||d.success===false)throw new Error(d.error||'Request failed.');return d}
function show(data){loaded=true;$('cashDisplay').textContent=fmt(data.cash);$('punchesDisplay').textContent=fmt(data.punches);$('rebirthsDisplay').textContent=fmt(data.rebirths);$('cash').value=Number(data.cash)||0;$('punches').value=Number(data.punches)||0;$('rebirths').value=Number(data.rebirths)||0;$('tokens').value=Number(data.rebirthTokens)||0}
async function loadPlayer(){const n=target();if(!n){status('Enter a player username first.');$('target').focus();return}status('Loading '+n+'...');try{const d=await req('get_player',{targetUsername:n});show(d);status('Loaded '+d.username+'. You can now edit, ban, unban, reset, or delete this player.')}catch(e){loaded=false;status(e.message)}}
async function act(action,confirmText){const n=target();if(!n){status('Enter a player username first.');$('target').focus();return}if(confirmText&&!confirm(confirmText))return;try{status('Working...');const d=await req(action,{targetUsername:n,cash:Number($('cash').value)||0,punches:Number($('punches').value)||0,rebirths:Number($('rebirths').value)||0,rebirthTokens:Number($('tokens').value)||0});status(d.message||'Done.');if(['set_stats','add_stats','reset_progress'].includes(action)){const fresh=await req('get_player',{targetUsername:n});show(fresh)}}catch(e){status(e.message)}}
$('load').onclick=loadPlayer;$('target').addEventListener('keydown',e=>{if(e.key==='Enter')loadPlayer()});$('set').onclick=()=>act('set_stats');$('add').onclick=()=>act('add_stats');$('ban').onclick=()=>act('ban_player','Ban this player account?');$('unban').onclick=()=>act('unban_player','Unban this player account?');$('ipban').onclick=()=>act('ban_ip','IP-ban this player\'s recorded IP?');$('ipunban').onclick=()=>act('unban_ip','Remove the IP ban?');$('reset').onclick=()=>act('reset_progress','Reset this player\'s entire game progress?');$('delete').onclick=()=>act('delete_player','DELETE this player account permanently?');
profile=profileLoad();if(!profile?.username||!profile?.authToken){status('Owner login required. Log in as '+OWNER+' in the main game first, then open this Owner Panel.');}else if(profile.username!==OWNER){status('Owner access denied. This panel is only for '+OWNER+'.')}else{$('content').style.display='block';status('Owner access verified. Enter a player username above.');$('target').focus()}
</script>
</body></html>
