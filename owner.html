<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 600px;
            background: #111;
            border: 1px solid #333;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,.5);
        }

        h1 {
            margin: 0 0 5px;
            font-size: 30px;
        }

        .owner-name {
            color: #aaa;
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background: #000;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            background: #1a1a1a;
            margin-bottom: 20px;
            color: #bbb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat {
            background: #191919;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-title {
            color: #999;
            font-size: 13px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        .inputs {
            display: grid;
            gap: 12px;
        }

        label {
            font-size: 14px;
            color: #bbb;
        }

        input {
            width: 100%;
            margin-top: 5px;
            padding: 12px;
            background: #090909;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }

        .player-picker {
            margin-bottom: 20px;
        }

        .player-row {
            display: grid;
            grid-template-columns: 1fr 90px;
            gap: 10px;
            margin-top: 5px;
        }

        .player-row input {
            margin-top: 0;
            min-width: 0;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
            cursor: text;
        }

        .player-row button {
            margin: 0;
            min-height: 46px;
            background: white;
            color: black;
        }

        #rebirthTokensInput {
            margin-bottom: 0;
        }

        @media (max-width: 500px) {
            .player-row {
                grid-template-columns: 1fr;
            }
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #setBtn {
            background: white;
            color: black;
        }

        #addBtn {
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="panel">

    <h1>OWNER PANEL</h1>

    <div class="owner-name">
        itskillerultrayt
    </div>

    <div class="tag">
        FOUNDER / OWNER
    </div>

    <div id="status" class="status">
        Checking owner access...
    </div>

    <div id="panelContent" style="display:none;">

        <div class="player-picker">
            <label for="playerUsername">Player username</label>
            <div class="player-row">
                <input
                    id="playerUsername"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="Enter a player username"
                    aria-label="Player username"
                >
                <button id="loadPlayerBtn" type="button">LOAD</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-title">CASH</div>
                <div id="cashDisplay" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">PUNCHES</div>
                <div id="punchesDisplay" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">REBIRTHS</div>
                <div id="rebirthsDisplay" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">REBIRTH TOKENS</div>
                <div id="rebirthTokensDisplay" class="stat-value">0</div>
            </div>
        </div>

        <div class="inputs">

            <div>
                <label for="cashInput">Cash</label>
                <input id="cashInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

            <div>
                <label for="punchesInput">Punches</label>
                <input id="punchesInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

            <div>
                <label for="rebirthsInput">Rebirths</label>
                <input id="rebirthsInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

            <div>
                <label for="rebirthTokensInput">Rebirth Tokens</label>
                <input id="rebirthTokensInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

        </div>

        <div class="buttons">
            <button id="setBtn" type="button">
                SET STATS
            </button>

            <button id="addBtn" type="button">
                ADD TO STATS
            </button>
        </div>

    </div>

    <a class="back" href="/">
        ← Back to Game
    </a>

</div>

<script>

const PROFILE_KEY = "boxing_clicker_profile_v2";
const OWNER_USERNAME = "itskillerultrayt";
const OWNER_API = "/api/owner";

let profile = null;

const statusBox = document.getElementById("status");
const panelContent = document.getElementById("panelContent");

const cashDisplay = document.getElementById("cashDisplay");
const punchesDisplay = document.getElementById("punchesDisplay");
const rebirthsDisplay = document.getElementById("rebirthsDisplay");
const rebirthTokensDisplay = document.getElementById("rebirthTokensDisplay");

const playerUsername = document.getElementById("playerUsername");
const loadPlayerBtn = document.getElementById("loadPlayerBtn");

const cashInput = document.getElementById("cashInput");
const punchesInput = document.getElementById("punchesInput");
const rebirthsInput = document.getElementById("rebirthsInput");
const rebirthTokensInput = document.getElementById("rebirthTokensInput");

const setBtn = document.getElementById("setBtn");
const addBtn = document.getElementById("addBtn");


function getProfile() {

    try {
        const saved = localStorage.getItem(PROFILE_KEY);

        if (!saved) {
            return null;
        }

        return JSON.parse(saved);

    } catch (error) {
        return null;
    }
}


function formatNumber(number) {
    return Number(number || 0).toLocaleString();
}


function setStatus(message) {
    statusBox.textContent = message;
}


async function ownerRequest(action, values = {}) {

    const response = await fetch(OWNER_API, {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            action: action,
            username: profile.username,
            authToken: profile.authToken,
            ...values
        })
    });

    return await response.json();
}


function displayStats(data) {

    cashDisplay.textContent = formatNumber(data.cash);
    punchesDisplay.textContent = formatNumber(data.punches);
    rebirthsDisplay.textContent = formatNumber(data.rebirths);
    rebirthTokensDisplay.textContent = formatNumber(data.rebirthTokens);

    cashInput.value = data.cash;
    punchesInput.value = data.punches;
    rebirthsInput.value = data.rebirths;
    rebirthTokensInput.value = data.rebirthTokens;
}


async function loadOwnerStats() {

    try {

        const targetUsername = playerUsername.value.trim();

        if (!targetUsername) {
            setStatus("Enter a player username first.");
            playerUsername.focus();
            return;
        }

        loadPlayerBtn.disabled = true;
        setStatus("Loading player...");

        const data = await ownerRequest("get_player", {
            targetUsername
        });

        if (!data.success) {
            setStatus(data.error || "Could not load player.");
            return;
        }

        displayStats(data);
        setStatus("Loaded: " + data.username);

    } catch (error) {

        setStatus("Could not connect to the owner server.");

    } finally {
        loadPlayerBtn.disabled = false;
    }
}


async function setStats() {

    setBtn.disabled = true;
    addBtn.disabled = true;

    setStatus("Saving owner stats...");

    try {

        const targetUsername = playerUsername.value.trim();

        if (!targetUsername) {
            setStatus("Enter a player username first.");
            playerUsername.focus();
            return;
        }

        const data = await ownerRequest("set_stats", {

            targetUsername,
            cash: Number(cashInput.value) || 0,
            punches: Number(punchesInput.value) || 0,
            rebirths: Number(rebirthsInput.value) || 0,
            rebirthTokens: Number(rebirthTokensInput.value) || 0

        });

        if (!data.success) {

            setStatus(data.error || "Could not update stats.");

            return;
        }

        displayStats(data);

        setStatus("Owner stats successfully updated.");

    } catch (error) {

        setStatus("Server connection failed.");

    } finally {

        setBtn.disabled = false;
        addBtn.disabled = false;
    }
}


async function addStats() {

    setBtn.disabled = true;
    addBtn.disabled = true;

    setStatus("Adding stats...");

    try {

        const targetUsername = playerUsername.value.trim();

        if (!targetUsername) {
            setStatus("Enter a player username first.");
            playerUsername.focus();
            return;
        }

        const data = await ownerRequest("add_stats", {

            targetUsername,
            cash: Number(cashInput.value) || 0,
            punches: Number(punchesInput.value) || 0,
            rebirths: Number(rebirthsInput.value) || 0,
            rebirthTokens: Number(rebirthTokensInput.value) || 0

        });

        if (!data.success) {

            setStatus(data.error || "Could not add stats.");

            return;
        }

        displayStats(data);

        setStatus("Stats successfully added.");

    } catch (error) {

        setStatus("Server connection failed.");

    } finally {

        setBtn.disabled = false;
        addBtn.disabled = false;
    }
}


loadPlayerBtn.addEventListener("click", loadOwnerStats);
setBtn.addEventListener("click", setStats);
addBtn.addEventListener("click", addStats);

playerUsername.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        event.preventDefault();
        loadOwnerStats();
    }
});


profile = getProfile();


if (!profile) {

    setStatus(
        "No login session found. Log in to your owner account on the main game first."
    );

} else if (
    profile.username !== OWNER_USERNAME ||
    !profile.authToken
) {

    setStatus("OWNER ACCESS DENIED.");

} else {

    panelContent.style.display = "block";
    setStatus("Owner access verified. Enter a player username.");

}

</script>

</body>
</html>
