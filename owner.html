<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 600px;
            background: #111;
            border: 1px solid #333;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,.5);
        }

        h1 {
            margin: 0 0 5px;
            font-size: 30px;
        }

        .owner-name {
            color: #aaa;
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background: #000;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            background: #1a1a1a;
            margin-bottom: 20px;
            color: #bbb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat {
            background: #191919;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-title {
            color: #999;
            font-size: 13px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        .inputs {
            display: grid;
            gap: 12px;
        }

        label {
            font-size: 14px;
            color: #bbb;
        }

        input {
            width: 100%;
            margin-top: 5px;
            padding: 12px;
            background: #090909;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }

        .player-picker {
            margin-bottom: 20px;
        }

        .player-row {
            display: grid;
            grid-template-columns: 1fr 90px;
            gap: 10px;
            margin-top: 5px;
        }

        .player-row input {
            margin-top: 0;
            min-width: 0;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
            cursor: text;
        }

        .player-row button {
            margin: 0;
            min-height: 46px;
            background: white;
            color: black;
        }

        #rebirthTokensInput {
            margin-bottom: 0;
        }

        @media (max-width: 500px) {
            .player-row {
                grid-template-columns: 1fr;
            }
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #setBtn {
            background: white;
            color: black;
        }

        #addBtn {
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="panel">

    <h1>OWNER PANEL</h1>

    <div class="owner-name">
        itskillerultrayt
    </div>

    <div class="tag">
        FOUNDER / OWNER
    </div>

    <div id="status" class="status">
        Checking owner access...
    </div>

    <div id="panelContent" style="display:none;">

        <div class="player-picker">
            <label for="playerUsername">Player username</label>
            <div class="player-row">
                <input
                    id="playerUsername"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="Enter a player username"
                    aria-label="Player username"
                >
                <button id="loadPlayerBtn" type="button">LOAD</button>
            </div>
            <div id="suggestions" style="display:none;position:relative;margin-top:6px;background:#111;border:1px solid #444;border-radius:10px;overflow:hidden;"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-title">CASH</div>
                <div id="cashDisplay" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">PUNCHES</div>
                <div id="punchesDisplay" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">REBIRTHS</div>
                <div id="rebirthsDisplay" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">REBIRTH TOKENS</div>
                <div id="rebirthTokensDisplay" class="stat-value">0</div>
            </div>
        </div>

        <div class="inputs">

            <div>
                <label for="cashInput">Cash</label>
                <input id="cashInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

            <div>
                <label for="punchesInput">Punches</label>
                <input id="punchesInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

            <div>
                <label for="rebirthsInput">Rebirths</label>
                <input id="rebirthsInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

            <div>
                <label for="rebirthTokensInput">Rebirth Tokens</label>
                <input id="rebirthTokensInput" type="number" min="0" inputmode="numeric" value="0">
            </div>

        </div>

        <div class="buttons">
            <button id="setBtn" type="button">SET STATS</button>
            <button id="addBtn" type="button">ADD TO STATS</button>
            <button id="resetBtn" type="button" style="background:#7c2d12;color:white;">RESET PLAYER</button>
            <button id="deleteBtn" type="button" style="background:#991b1b;color:white;">DELETE PLAYER</button>
        </div>

    </div>

    <a class="back" href="/">
        ← Back to Game
    </a>

</div>

<script>
const PROFILE_KEY="boxing_clicker_profile_v2", OWNER_USERNAME="itskillerultrayt", OWNER_API="/api/owner", SUGGEST_API="/api/player-suggestions";
let profile=null, suggestTimer=null;
const $=id=>document.getElementById(id);
const statusBox=$("status"), panelContent=$("panelContent"), cashDisplay=$("cashDisplay"), punchesDisplay=$("punchesDisplay"), rebirthsDisplay=$("rebirthsDisplay"), rebirthTokensDisplay=$("rebirthTokensDisplay");
const playerUsername=$("playerUsername"), loadPlayerBtn=$("loadPlayerBtn"), suggestions=$("suggestions");
const cashInput=$("cashInput"), punchesInput=$("punchesInput"), rebirthsInput=$("rebirthsInput"), rebirthTokensInput=$("rebirthTokensInput");
const setBtn=$("setBtn"), addBtn=$("addBtn"), resetBtn=$("resetBtn"), deleteBtn=$("deleteBtn");
function getProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||"null")}catch{return null}}
function formatNumber(n){return Number(n||0).toLocaleString()}
function setStatus(m){statusBox.textContent=m}
async function ownerRequest(action,values={}){const r=await fetch(OWNER_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,username:profile.username,authToken:profile.authToken,...values})});let d;try{d=await r.json()}catch{d={success:false,error:"Invalid server response."}};return d}
function displayStats(d){cashDisplay.textContent=formatNumber(d.cash);punchesDisplay.textContent=formatNumber(d.punches);rebirthsDisplay.textContent=formatNumber(d.rebirths);rebirthTokensDisplay.textContent=formatNumber(d.rebirthTokens);cashInput.value=d.cash;punchesInput.value=d.punches;rebirthsInput.value=d.rebirths;rebirthTokensInput.value=d.rebirthTokens}
function hideSuggestions(){suggestions.style.display="none";suggestions.innerHTML=""}
function chooseSuggestion(name){playerUsername.value=name;hideSuggestions();loadOwnerStats()}
function renderSuggestions(players){suggestions.innerHTML="";if(!players.length){hideSuggestions();return}players.forEach(name=>{const b=document.createElement("button");b.type="button";b.textContent=name;b.style.cssText="display:block;width:100%;padding:12px;text-align:left;background:#111;color:#fff;border:0;border-bottom:1px solid #2a2a2a;font-size:15px;cursor:pointer";b.addEventListener("click",()=>chooseSuggestion(name));suggestions.appendChild(b)});suggestions.style.display="block"}
async function fetchSuggestions(){const q=playerUsername.value.trim();if(!q){hideSuggestions();return}try{const r=await fetch(SUGGEST_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:profile.username,authToken:profile.authToken,search:q})});const d=await r.json();if(d.success)renderSuggestions(Array.isArray(d.players)?d.players:[]);else hideSuggestions()}catch{hideSuggestions()}}
async function loadOwnerStats(){hideSuggestions();const targetUsername=playerUsername.value.trim();if(!targetUsername){setStatus("Enter a player username first.");playerUsername.focus();return}loadPlayerBtn.disabled=true;setStatus("Loading player...");try{const d=await ownerRequest("get_player",{targetUsername});if(!d.success){setStatus(d.error||"Could not load player.");return}displayStats(d);setStatus("Loaded: "+d.username)}catch{setStatus("Could not connect to the owner server.")}finally{loadPlayerBtn.disabled=false}}
async function setStats(){setBtn.disabled=addBtn.disabled=resetBtn.disabled=deleteBtn.disabled=true;const targetUsername=playerUsername.value.trim();if(!targetUsername){setStatus("Enter a player username first.");playerUsername.focus();setBtn.disabled=addBtn.disabled=resetBtn.disabled=deleteBtn.disabled=false;return}setStatus("Saving player stats...");try{const d=await ownerRequest("set_stats",{targetUsername,cash:Number(cashInput.value)||0,punches:Number(punchesInput.value)||0,rebirths:Number(rebirthsInput.value)||0,rebirthTokens:Number(rebirthTokensInput.value)||0});if(!d.success){setStatus(d.error||"Could not update stats.");return}displayStats(d);setStatus("Player stats updated.")}catch{setStatus("Server connection failed.")}finally{setBtn.disabled=addBtn.disabled=resetBtn.disabled=deleteBtn.disabled=false}}
async function addStats(){setBtn.disabled=addBtn.disabled=resetBtn.disabled=deleteBtn.disabled=true;const targetUsername=playerUsername.value.trim();if(!targetUsername){setStatus("Enter a player username first.");playerUsername.focus();setBtn.disabled=addBtn.disabled=resetBtn.disabled=deleteBtn.disabled=false;return}setStatus("Adding stats...");try{const d=await ownerRequest("add_stats",{targetUsername,cash:Number(cashInput.value)||0,punches:Number(punchesInput.value)||0,rebirths:Number(rebirthsInput.value)||0,rebirthTokens:Number(rebirthTokensInput.value)||0});if(!d.success){setStatus(d.error||"Could not add stats.");return}displayStats(d);setStatus("Stats successfully added.")}catch{setStatus("Server connection failed.")}finally{setBtn.disabled=addBtn.disabled=resetBtn.disabled=deleteBtn.disabled=false}}
async function resetPlayer(){const targetUsername=playerUsername.value.trim();if(!targetUsername)return setStatus("Enter a player username first.");if(!confirm("Reset ALL progress for "+targetUsername+"? This cannot be undone."))return;setStatus("Resetting player...");const d=await ownerRequest("reset_progress",{targetUsername});setStatus(d.success?"Player progress reset.":(d.error||"Could not reset player."));if(d.success)loadOwnerStats()}
async function deletePlayer(){const targetUsername=playerUsername.value.trim();if(!targetUsername)return setStatus("Enter a player username first.");if(!confirm("DELETE the account "+targetUsername+" permanently?"))return;setStatus("Deleting player...");const d=await ownerRequest("delete_player",{targetUsername});if(d.success){playerUsername.value="";displayStats({cash:0,punches:0,rebirths:0,rebirthTokens:0});setStatus("Player account deleted.")}else setStatus(d.error||"Could not delete player.")}
loadPlayerBtn.addEventListener("click",loadOwnerStats);setBtn.addEventListener("click",setStats);addBtn.addEventListener("click",addStats);resetBtn.addEventListener("click",resetPlayer);deleteBtn.addEventListener("click",deletePlayer);
playerUsername.addEventListener("input",()=>{clearTimeout(suggestTimer);suggestTimer=setTimeout(fetchSuggestions,220)});playerUsername.addEventListener("focus",fetchSuggestions);playerUsername.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();loadOwnerStats()}if(e.key==="Escape")hideSuggestions()});document.addEventListener("click",e=>{if(!e.target.closest(".player-picker"))hideSuggestions()});
profile=getProfile();
if(!profile)setStatus("No login session found. Log in to your owner account on the main game first.");
else if(profile.username!==OWNER_USERNAME||!profile.authToken)setStatus("OWNER ACCESS DENIED.");
else{panelContent.style.display="block";setStatus("Owner access verified. Enter a player username.")}
</script>

</body>
</html>
